name: Refresh Support UI Snapshots
on:
  push:
    branches: [feature/support-tiptap-editor]
    paths: [.github/workflows/support-snapshots-once.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update only three changed component snapshots
        run: |
          pnpm exec jest --runInBand --updateSnapshot \
            packages/decap-cms-core/src/components/Editor/__tests__/EditorToolbar.spec.js \
            packages/decap-cms-core/src/components/Collection/__tests__/Sidebar.spec.js \
            packages/decap-cms-core/src/components/Collection/__tests__/Collection.spec.js
      - name: Commit reviewed-scope snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/decap-cms-core/src/components/Editor/__tests__/__snapshots__/EditorToolbar.spec.js.snap packages/decap-cms-core/src/components/Collection/__tests__/__snapshots__/Sidebar.spec.js.snap packages/decap-cms-core/src/components/Collection/__tests__/__snapshots__/Collection.spec.js.snap
          if ! git diff --cached --quiet; then
            git commit -m "test(support): refresh snapshots for updated editor and collection UI"
            git push
          fi
