name: Update Tiptap lockfile
on:
  push:
    branches:
      - feature/support-tiptap-editor
    paths:
      - '.github/workflows/support-tiptap-lockfile.yml'
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/support-tiptap-editor
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit updated lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(support): update lockfile for Tiptap'
          git push origin HEAD:feature/support-tiptap-editor
