name: Format Support Editor PR
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/support-format-fix.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feature/support-editor-block-tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/decap-cms-app/src/SupportTiptapControl.jsx packages/decap-cms-core/src/components/Editor/EditorToolbar.js
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/decap-cms-app/src/SupportTiptapControl.jsx packages/decap-cms-core/src/components/Editor/EditorToolbar.js
          if ! git diff --cached --quiet; then
            git commit -m "Format Support Manager editor files"
            git push
          fi
