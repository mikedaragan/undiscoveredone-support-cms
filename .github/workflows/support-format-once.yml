name: Format Support Editor
on:
  push:
    branches:
      - feature/support-tiptap-editor
    paths:
      - .github/workflows/support-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only flagged files
        run: |
          pnpm exec prettier --write \
            packages/decap-cms-app/src/SupabaseAuthenticationPage.jsx \
            packages/decap-cms-app/src/SupportTiptapControl.jsx \
            packages/decap-cms-core/src/components/App/App.js \
            packages/decap-cms-core/src/components/Collection/CollectionTop.js \
            packages/decap-cms-core/src/components/Collection/Sidebar.js \
            packages/decap-cms-core/src/components/Editor/EditorControlPane/EditorControlPane.js \
            packages/decap-cms-core/src/components/Editor/EditorInterface.js \
            packages/decap-cms-core/src/components/Editor/EditorToolbar.js \
            packages/decap-cms-core/src/components/UI/ErrorBoundary.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/decap-cms-app/src/SupabaseAuthenticationPage.jsx packages/decap-cms-app/src/SupportTiptapControl.jsx packages/decap-cms-core/src/components/App/App.js packages/decap-cms-core/src/components/Collection/CollectionTop.js packages/decap-cms-core/src/components/Collection/Sidebar.js packages/decap-cms-core/src/components/Editor/EditorControlPane/EditorControlPane.js packages/decap-cms-core/src/components/Editor/EditorInterface.js packages/decap-cms-core/src/components/Editor/EditorToolbar.js packages/decap-cms-core/src/components/UI/ErrorBoundary.js
          if ! git diff --cached --quiet; then
            git commit -m "style(support): apply Prettier to editor files"
            git push
          fi
