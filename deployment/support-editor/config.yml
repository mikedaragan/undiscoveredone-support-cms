# Draft only. Do not deploy publicly until GitHub OAuth and Access are configured.
backend:
  name: github
  repo: mikedaragan/undiscoveredone-support-content
  branch: main
  # base_url: https://YOUR-OAUTH-BROKER.example.com
  # auth_endpoint: auth
media_folder: "images/uploads"
public_folder: "/images/uploads"
publish: false
collections:
  - name: help
    label: Help Articles
    folder: articles
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Category, name: category, widget: select, options: ["Accounts", "Music", "Music Plus", "Digital Ownership", "Creators", "Purchases", "Troubleshooting"] }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Updated, name: updated_at, widget: datetime }
      - { label: Body, name: body, widget: markdown }
