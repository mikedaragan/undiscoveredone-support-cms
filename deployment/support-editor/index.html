<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Undiscovered One · Support Editor</title>
<style>
#support-diagnostics {position:fixed;inset:0;z-index:2147483647;background:#fff;color:#18212c;padding:24px;font:15px/1.5 system-ui,sans-serif;overflow:auto}
#support-diagnostics pre {white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f7;padding:12px;border-radius:8px}
</style>
<script>
(function(){
  var stage='HTML loaded',errors=[],started=Date.now();
  function status(){
    var el=document.getElementById('support-diagnostics');
    if(!el)return;
    var detail=document.getElementById('support-diagnostic-detail');
    if(detail)detail.textContent='Stage: '+stage+'\nElapsed: '+Math.round((Date.now()-started)/1000)+' seconds\n'+(errors.join('\n')||'No JavaScript error captured');
  }
  function failure(message){errors.push(message);stage='Error detected';status();}
  window.addEventListener('error',function(e){failure('Error: '+(e.message||'unknown')+' at '+(e.filename||'inline')+':'+(e.lineno||0));});
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;
    var description;
    try {
      if(r==null) description=String(r);
      else if(typeof r==='string') description=r;
      else {
        var details=[];
        details.push('type: '+Object.prototype.toString.call(r));
        details.push('name: '+String(r.name||'unknown'));
        details.push('message: '+String(r.message||'not provided'));
        if(r.status)details.push('status: '+String(r.status));
        if(r.statusText)details.push('statusText: '+String(r.statusText));
        if(r.url)details.push('url: '+String(r.url));
        if(r.response&&r.response.status)details.push('response status: '+String(r.response.status));
        if(r.stack)details.push('stack: '+String(r.stack));
        try { details.push('keys: '+Object.keys(r).join(', ')); } catch(ignore){}
        try { details.push('JSON: '+JSON.stringify(r)); } catch(ignore){}
        description=details.join('\\n');
      }
    }catch(error){description='Could not describe rejection: '+String(error);}
    failure('Rejected promise:\\n'+description);
  });
  window.supportEditorScriptLoaded=function(){stage='CMS script downloaded';status();};
  window.supportEditorScriptFailed=function(){failure('Could not download decap-cms.js');};
  window.addEventListener('DOMContentLoaded',function(){
    status();
    setTimeout(function(){
      var root=document.querySelector('#nc-root, #root');
      var content=root&&root.textContent&&root.textContent.trim();
      var appVisible=!!(content&&content.length>5);
      if(appVisible&&!errors.length){document.getElementById('support-diagnostics').style.display='none';}
      else {stage=appVisible?'CMS generated content, but an error occurred':'CMS has not rendered visible content';status();}
    },10000);
  });
})();
</script>
</head>
<body>
<div id="support-diagnostics" role="status">
<h2>Undiscovered One Support Editor</h2>
<p>Checking the CMS startup. This panel will disappear when the editor loads successfully.</p>
<pre id="support-diagnostic-detail">Stage: HTML loaded</pre>
</div>
<script src="./decap-cms.js" onload="supportEditorScriptLoaded()" onerror="supportEditorScriptFailed()"></script>
</body>
</html>
