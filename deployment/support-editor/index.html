<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Undiscovered One · Support Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --support-primary: #5265A8;
    --support-primary-dark: #354780;
    --support-primary-deep: #202D58;
    --support-primary-soft: #E9EDF8;
    --support-primary-pale: #F5F7FC;
    --support-border: #CDD5EB;
    --support-heading-font: 'Bricolage Grotesque', sans-serif;
    --support-body-font: 'Satoshi', system-ui, sans-serif;
  }
  html, body, #nc-root { font-family: var(--support-body-font); }
  body, button, input, textarea, select, label, nav, [role="button"] {
    font-family: var(--support-body-font) !important;
  }
  h1, h2, h3, h4, h5, h6, [role="heading"] {
    font-family: var(--support-heading-font) !important;
    letter-spacing: -0.025em;
  }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
  select:focus-visible, [contenteditable="true"]:focus-visible {
    outline: 2px solid var(--support-primary) !important;
    outline-offset: 2px;
  }
  ::selection { background: #CDD5EB; color: #202D58; }
  .uo-tiptap-document { font-family: var(--support-body-font) !important; }
  .uo-tiptap-document h1, .uo-tiptap-document h2, .uo-tiptap-document h3,
  .uo-tiptap-document h4, .uo-tiptap-document h5, .uo-tiptap-document h6 {
    font-family: var(--support-heading-font) !important;
  }
  .uo-tiptap-document a { color: var(--support-primary); }
</style>
</head>
<body>
<script src="./decap-cms.js"></script>
</body>
</html>
